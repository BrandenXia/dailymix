[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailymix"
version = "0.1.0"
description = "Deterministic local Apple Music recommendations with optional Last.fm history"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dailymix = "dailymix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dailymix.sources" = ["*.js"]
